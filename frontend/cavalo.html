<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cavalos | Haras Bela Vista</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ==============================
           CAVALOS
        ============================== */

        .horses-section {
            margin-top: 10px;
        }

        .horses-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .new-horse-button {
            border: none;
            background: #3d3026;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .new-horse-button:hover {
            opacity: 0.9;
        }

        .horses-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .horse-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;

            box-shadow:
                0 5px 18px rgba(61, 48, 38, 0.06);

            transition: 0.2s;

            display: flex;
            flex-direction: column;
        }

        .horse-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 10px 25px rgba(61, 48, 38, 0.10);
        }


        /* ==============================
           FOTO
        ============================== */

        .horse-photo {
            width: 100%;
            height: 210px;

            background: #eee4d3;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .horse-photo img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .horse-photo-placeholder {
            font-size: 60px;
        }


        /* ==============================
           CONTEÚDO CARD
        ============================== */

        .horse-content {
            padding: 22px;

            display: flex;
            flex-direction: column;

            flex: 1;
        }

        .horse-header-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 10px;

            margin-bottom: 16px;
        }

        .horse-name {
            font-family: Georgia, serif;

            font-size: 22px;

            color: #3d3026;

            margin: 0 0 5px 0;

            font-weight: 500;
        }

        .horse-breed {
            color: #a1825b;

            font-size: 12px;

            margin: 0;
        }


        /* ==============================
           STATUS
        ============================== */

        .horse-status {
            padding: 6px 10px;

            border-radius: 20px;

            font-size: 10px;

            white-space: nowrap;
        }

        .status-available {
            background: #e4eee3;
            color: #557052;
        }

        .status-unavailable {
            background: #f3e1dd;
            color: #9b6258;
        }


        /* ==============================
           INFORMAÇÕES
        ============================== */

        .horse-info {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 13px;

            padding-top: 16px;

            border-top: 1px solid #eee8df;
        }

        .horse-info-item {
            display: flex;
            flex-direction: column;

            gap: 3px;
        }

        .horse-info-item span {
            color: #8d8074;

            font-size: 10px;
        }

        .horse-info-item strong {
            color: #3d3026;

            font-size: 12px;

            font-weight: 500;

            word-break: break-word;
        }


        /* ==============================
           AÇÕES
        ============================== */

        .horse-actions {
            display: flex;

            gap: 10px;

            margin-top: auto;

            padding-top: 18px;
        }

        .horse-actions button {
            border: none;

            padding: 9px 14px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 12px;
        }

        .edit-button {
            background: #eee4d3;
            color: #5f4d3d;
        }

        .delete-button {
            background: #f3e1dd;
            color: #9b6258;
        }

        .horse-actions button:hover {
            opacity: 0.85;
        }

        .horse-loading {
            color: #8d8074;

            font-size: 14px;
        }


        /* ==============================
           MODAL
        ============================== */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(45, 36, 29, 0.45);

            align-items: center;

            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;

            width: 100%;

            max-width: 560px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 22px;

            padding: 28px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.15);
        }

        .modal-content h3 {
            font-family: Georgia, serif;

            margin: 0 0 22px 0;

            font-size: 24px;

            color: #3d3026;
        }


        /* ==============================
           FORMULÁRIO
        ============================== */

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            font-size: 12px;

            color: #76695d;

            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            box-sizing: border-box;

            padding: 11px 12px;

            border: 1px solid #ddd4c9;

            border-radius: 10px;

            font-size: 13px;

            outline: none;

            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #a1825b;
        }

        .form-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 14px;
        }


        /* ==============================
           FOTO NO FORMULÁRIO
        ============================== */

        .photo-preview {
            width: 100%;

            height: 180px;

            border-radius: 14px;

            background: #eee4d3;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 10px;
        }

        .photo-preview img {
            width: 100%;

            height: 100%;

            object-fit: cover;
        }

        .photo-preview-placeholder {
            font-size: 55px;
        }

        .form-group input[type="file"] {
            padding: 9px;
        }


        /* ==============================
           BOTÕES MODAL
        ============================== */

        .modal-buttons {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;
        }

        .modal-buttons button {
            border: none;

            padding: 11px 17px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 13px;
        }

        .cancel-button {
            background: #eee8df;

            color: #6d6258;
        }

        .save-button {
            background: #3d3026;

            color: white;
        }

        .save-button:hover,
        .cancel-button:hover {
            opacity: 0.85;
        }


        /* ==============================
           RESPONSIVO
        ============================== */

        @media (max-width: 1100px) {

            .horses-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .horses-grid {
                grid-template-columns: 1fr;
            }

            .horses-header {
                align-items: flex-start;

                gap: 15px;

                flex-direction: column;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="layout">


    <!-- ==============================
         MENU
    ============================== -->

    <aside class="sidebar">

        <div class="logo">

            <span>🐎</span>

            <h1>Haras</h1>

            <p>Bela Vista</p>

        </div>


        <nav class="menu">

            <a href="index.html" class="menu-item">
                <span>⌂</span>
                Início
            </a>

            <a href="cavalo.html" class="menu-item active">
                <span>🐴</span>
                Cavalos
            </a>

            <a href="passeios.html" class="menu-item">
                <span>🏇</span>
                Passeios
            </a>

            <a href="clientes.html" class="menu-item">
                <span>👥</span>
                Clientes
            </a>

            <a href="proprietarios.html" class="menu-item">
                <span>👤</span>
                Proprietários
            </a>

            <a href="equipamentos.html" class="menu-item">
                <span>🎒</span>
                Equipamentos
            </a>

            <a href="shop.html" class="menu-item">
                <span>🏪</span>
                Shop
            </a>

            <a href="relatorios.html" class="menu-item">
                <span>📊</span>
                Relatórios
            </a>

        </nav>

    </aside>


    <!-- ==============================
         CONTEÚDO
    ============================== -->

    <main class="main-content">


        <header class="topbar">

            <div>

                <p class="welcome">
                    GERENCIAMENTO
                </p>

                <h2>
                    Cavalos
                </h2>

            </div>


            <div class="manager">

                <div class="manager-icon">
                    👤
                </div>

                <div>

                    <strong>
                        Gerente
                    </strong>

                    <small>
                        Administrador
                    </small>

                </div>

            </div>

        </header>


        <!-- ==============================
             CAVALOS
        ============================== -->

        <section class="horses-section">


            <div class="horses-header">

                <div>

                    <p class="section-subtitle">
                        HARAS BELA VISTA
                    </p>

                    <h3>
                        Cavalos cadastrados
                    </h3>

                </div>


                <button
                    class="new-horse-button"
                    onclick="abrirNovoCavalo()"
                >
                    + Novo cavalo
                </button>

            </div>


            <div
                id="horsesGrid"
                class="horses-grid"
            >

                <p class="horse-loading">
                    Carregando cavalos...
                </p>

            </div>


        </section>


    </main>

</div>


<!-- ==============================
     MODAL
============================== -->

<div
    id="horseModal"
    class="modal"
>

    <div class="modal-content">


        <h3 id="modal-title">
            Novo cavalo
        </h3>


        <input
            type="hidden"
            id="horse-id"
        >


        <!-- FOTO -->

        <div class="form-group">

            <label>
                Foto do cavalo
            </label>


            <div
                id="photoPreview"
                class="photo-preview"
            >

                <span
                    class="photo-preview-placeholder"
                >
                    🐴
                </span>

            </div>


            <input
                type="file"
                id="horse-foto"
                accept="image/jpeg,image/png,image/webp"
                onchange="mostrarPreviewFoto(event)"
            >

        </div>


        <!-- NOME -->

        <div class="form-group">

            <label>
                Nome
            </label>

            <input
                type="text"
                id="horse-nome"
                placeholder="Nome do cavalo"
            >

        </div>


        <!-- RAÇA + SEXO -->

        <div class="form-row">


            <div class="form-group">

                <label>
                    Raça
                </label>

                <select id="horse-raca">

                    <option value="">
                        Selecione a raça
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Sexo
                </label>

                <select id="horse-sexo">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Macho">
                        Macho
                    </option>

                    <option value="Fêmea">
                        Fêmea
                    </option>

                </select>

            </div>


        </div>


        <!-- DATA + PELAGEM -->

        <div class="form-row">


            <div class="form-group">

                <label>
                    Data de nascimento
                </label>

                <input
                    type="date"
                    id="horse-data"
                >

            </div>


            <div class="form-group">

                <label>
                    Pelagem
                </label>

                <input
                    type="text"
                    id="horse-pelagem"
                    placeholder="Ex.: Castanha"
                >

            </div>


        </div>


        <!-- DISPONIBILIDADE -->

        <div class="form-group">

            <label>
                Disponibilidade
            </label>

            <select id="horse-disponibilidade">

                <option value="true">
                    Disponível
                </option>

                <option value="false">
                    Indisponível
                </option>

            </select>

        </div>


        <!-- PROPRIETÁRIO -->

        <div class="form-group">

            <label>
                Proprietário
            </label>

            <select id="horse-proprietario">

                <option value="">
                    Selecione o proprietário
                </option>

            </select>

        </div>


        <!-- BAIA -->

        <div class="form-group">

            <label>
                Baia
            </label>

            <select id="horse-baia">

                <option value="">
                    Selecione a baia
                </option>

            </select>

        </div>


        <!-- BOTÕES -->

        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="fecharModal()"
            >
                Cancelar
            </button>


            <button
                class="save-button"
                onclick="salvarCavalo()"
            >
                Salvar
            </button>

        </div>


    </div>

</div>


<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

let fotoAtual = null;


/* =====================================================
   CARREGAR CAVALOS
===================================================== */

async function carregarCavalos() {

    const grid =
        document.getElementById('horsesGrid');


    try {

        const resposta =
            await fetch('/cavalo');


        if (!resposta.ok) {

            throw new Error(
                'Erro HTTP: ' + resposta.status
            );

        }


        const cavalo =
            await resposta.json();


        grid.innerHTML = '';


        if (!cavalo.length) {

            grid.innerHTML = `
                <p class="horse-loading">
                    Nenhum cavalo cadastrado.
                </p>
            `;

            return;

        }


        cavalo.forEach(cavalo => {

            const card =
                document.createElement('article');


            card.className =
                'horse-card';


            const fotoHTML =
                cavalo.foto
                    ? `
                        <img
                            src="/images/${cavalo.foto}"
                            alt="Foto de ${cavalo.nome}"
                        >
                    `
                    : `
                        <span class="horse-photo-placeholder">
                            🐴
                        </span>
                    `;


            const statusClass =
                cavalo.disponibilidade
                    ? 'status-available'
                    : 'status-unavailable';


            const statusText =
                cavalo.disponibilidade
                    ? 'Disponível'
                    : 'Indisponível';


            card.innerHTML = `

                <div class="horse-photo">

                    ${fotoHTML}

                </div>


                <div class="horse-content">


                    <div class="horse-header-card">

                        <div>

                            <h4 class="horse-name">
                                ${escaparHTML(cavalo.nome)}
                            </h4>

                            <p class="horse-breed">
                                ${escaparHTML(cavalo.raca || 'Raça não informada')}
                            </p>

                        </div>


                        <span
                            class="horse-status ${statusClass}"
                        >
                            ${statusText}
                        </span>

                    </div>


                    <div class="horse-info">


                        <div class="horse-info-item">

                            <span>
                                Sexo
                            </span>

                            <strong>
                                ${escaparHTML(cavalo.sexo || 'Não informado')}
                            </strong>

                        </div>


                        <div class="horse-info-item">

                            <span>
                                Pelagem
                            </span>

                            <strong>
                                ${escaparHTML(cavalo.pelagem || 'Não informada')}
                            </strong>

                        </div>


                        <div class="horse-info-item">

                            <span>
                                Proprietário
                            </span>

                            <strong>
                                ${escaparHTML(cavalo.proprietario || 'Não informado')}
                            </strong>

                        </div>


                        <div class="horse-info-item">

                            <span>
                                Baia
                            </span>

                            <strong>
                                ${escaparHTML(
                                    cavalo.baia
                                        ? 'Baia ' + cavalo.baia
                                        : 'Não informada'
                                )}
                            </strong>

                        </div>


                        <div class="horse-info-item">

                            <span>
                                Nascimento
                            </span>

                            <strong>
                                ${formatarData(cavalo.data_nascimento)}
                            </strong>

                        </div>


                    </div>


                    <div class="horse-actions">

                        <button
                            class="edit-button"
                            onclick='editarCavalo(${JSON.stringify(cavalo)})'
                        >
                            ✏️ Editar
                        </button>


                        <button
                            class="delete-button"
                            onclick="excluirCavalo(${cavalo.id_cavalo})"
                        >
                            🗑️ Excluir
                        </button>

                    </div>


                </div>

            `;


            grid.appendChild(card);

        });


    } catch (erro) {

        console.error(
            'Erro ao carregar cavalos:',
            erro
        );


        grid.innerHTML = `
            <p class="horse-loading">
                Não foi possível carregar os cavalos.
            </p>
        `;

    }

}


/* =====================================================
   CARREGAR RAÇAS
===================================================== */

async function carregarRacas() {

    const select =
        document.getElementById('horse-raca');


    try {

        const resposta =
            await fetch('/racas');


        if (!resposta.ok) {
            throw new Error('Não foi possível carregar as raças.');
        }


        const racas =
            await resposta.json();


        select.innerHTML = `
            <option value="">
                Selecione a raça
            </option>
        `;


        racas.forEach(raca => {

            const option =
                document.createElement('option');

            option.value =
                raca.id_raca;

            option.textContent =
                raca.nome;

            select.appendChild(option);

        });


    } catch (erro) {

        console.error(
            'Erro ao carregar raças:',
            erro
        );

    }

}


/* =====================================================
   CARREGAR PROPRIETÁRIOS
===================================================== */

async function carregarProprietarios() {

    const select =
        document.getElementById('horse-proprietario');


    try {

        const resposta =
            await fetch('/proprietarios');


        if (!resposta.ok) {
            throw new Error(
                'Não foi possível carregar os proprietários.'
            );
        }


        const proprietarios =
            await resposta.json();


        select.innerHTML = `
            <option value="">
                Selecione o proprietário
            </option>
        `;


        proprietarios.forEach(proprietario => {

            const option =
                document.createElement('option');


            option.value =
                proprietario.id_proprietario;


            option.textContent =
                proprietario.nome;


            select.appendChild(option);

        });


    } catch (erro) {

        console.error(
            'Erro ao carregar proprietários:',
            erro
        );

    }

}


/* =====================================================
   CARREGAR BAIAS
===================================================== */

async function carregarBaias() {

    const select =
        document.getElementById('horse-baia');


    try {

        const resposta =
            await fetch('/baias');


        if (!resposta.ok) {
            throw new Error(
                'Não foi possível carregar as baias.'
            );
        }


        const baias =
            await resposta.json();


        select.innerHTML = `
            <option value="">
                Selecione a baia
            </option>
        `;


        baias.forEach(baia => {

            const option =
                document.createElement('option');


            option.value =
                baia.id_baia;


            option.textContent =
                baia.numero;


            select.appendChild(option);

        });


    } catch (erro) {

        console.error(
            'Erro ao carregar baias:',
            erro
        );

    }

}


/* =====================================================
   NOVO CAVALO
===================================================== */

async function abrirNovoCavalo() {

    document.getElementById(
        'modal-title'
    ).textContent =
        'Novo cavalo';


    document.getElementById(
        'horse-id'
    ).value =
        '';


    document.getElementById(
        'horse-nome'
    ).value =
        '';


    document.getElementById(
        'horse-sexo'
    ).value =
        '';


    document.getElementById(
        'horse-data'
    ).value =
        '';


    document.getElementById(
        'horse-pelagem'
    ).value =
        '';


    document.getElementById(
        'horse-disponibilidade'
    ).value =
        'true';


    document.getElementById(
        'horse-proprietario'
    ).value =
        '';


    document.getElementById(
        'horse-baia'
    ).value =
        '';


    document.getElementById(
        'horse-foto'
    ).value =
        '';


    fotoAtual = null;


    mostrarPlaceholder();


    document.getElementById(
        'horseModal'
    ).classList.add('active');

}


/* =====================================================
   EDITAR CAVALO
===================================================== */

async function editarCavalo(cavalo) {

    document.getElementById(
        'modal-title'
    ).textContent =
        'Editar cavalo';


    document.getElementById(
        'horse-id'
    ).value =
        cavalo.id_cavalo;


    document.getElementById(
        'horse-nome'
    ).value =
        cavalo.nome || '';


    document.getElementById(
        'horse-sexo'
    ).value =
        cavalo.sexo || '';


    document.getElementById(
        'horse-data'
    ).value =
        cavalo.data_nascimento
            ? String(cavalo.data_nascimento).substring(0, 10)
            : '';


    document.getElementById(
        'horse-pelagem'
    ).value =
        cavalo.pelagem || '';


    document.getElementById(
        'horse-disponibilidade'
    ).value =
        cavalo.disponibilidade
            ? 'true'
            : 'false';


    await carregarRacas();

    await carregarProprietarios();

    await carregarBaias();


    document.getElementById(
        'horse-raca'
    ).value =
        cavalo.id_raca || '';


    document.getElementById(
        'horse-proprietario'
    ).value =
        cavalo.id_proprietario || '';


    document.getElementById(
        'horse-baia'
    ).value =
        cavalo.id_baia || '';


    document.getElementById(
        'horse-foto'
    ).value =
        '';


    fotoAtual =
        cavalo.foto || null;


    if (cavalo.foto) {

        mostrarFotoAtual(
            cavalo.foto
        );

    } else {

        mostrarPlaceholder();

    }


    document.getElementById(
        'horseModal'
    ).classList.add('active');

}


/* =====================================================
   PREVIEW DA FOTO
===================================================== */

function mostrarPreviewFoto(event) {

    const arquivo =
        event.target.files[0];


    if (!arquivo) {

        if (fotoAtual) {

            mostrarFotoAtual(
                fotoAtual
            );

        } else {

            mostrarPlaceholder();

        }

        return;

    }


    const leitor =
        new FileReader();


    leitor.onload =
        function(e) {

            const preview =
                document.getElementById(
                    'photoPreview'
                );


            preview.innerHTML = `

                <img
                    src="${e.target.result}"
                    alt="Pré-visualização"
                >

            `;

        };


    leitor.readAsDataURL(arquivo);

}


/* =====================================================
   MOSTRAR FOTO ATUAL
===================================================== */

function mostrarFotoAtual(foto) {

    const preview =
        document.getElementById(
            'photoPreview'
        );


    preview.innerHTML = `

        <img
            src="/images/${foto}"
            alt="Foto atual do cavalo"
        >

    `;

}


/* =====================================================
   PLACEHOLDER
===================================================== */

function mostrarPlaceholder() {

    const preview =
        document.getElementById(
            'photoPreview'
        );


    preview.innerHTML = `

        <span
            class="photo-preview-placeholder"
        >
            🐴
        </span>

    `;

}


/* =====================================================
   FECHAR MODAL
===================================================== */

function fecharModal() {

    document.getElementById(
        'horseModal'
    ).classList.remove('active');

}


/* =====================================================
   SALVAR CAVALO
===================================================== */

async function salvarCavalo() {

    const id =
        document.getElementById(
            'horse-id'
        ).value;


    const nome =
        document.getElementById(
            'horse-nome'
        ).value.trim();


    const idRaca =
        document.getElementById(
            'horse-raca'
        ).value;


    const sexo =
        document.getElementById(
            'horse-sexo'
        ).value;


    const dataNascimento =
        document.getElementById(
            'horse-data'
        ).value;


    const pelagem =
        document.getElementById(
            'horse-pelagem'
        ).value.trim();


    const disponibilidade =
        document.getElementById(
            'horse-disponibilidade'
        ).value;


    const idProprietario =
        document.getElementById(
            'horse-proprietario'
        ).value;


    const idBaia =
        document.getElementById(
            'horse-baia'
        ).value;


    const arquivo =
        document.getElementById(
            'horse-foto'
        ).files[0];


    /* ==============================
       VALIDAÇÕES
    ============================== */

    if (!nome) {

        alert(
            'Informe o nome do cavalo.'
        );

        return;

    }


    if (!idRaca) {

        alert(
            'Selecione a raça.'
        );

        return;

    }


    if (!sexo) {

        alert(
            'Selecione o sexo.'
        );

        return;

    }


    if (!idProprietario) {

        alert(
            'Selecione o proprietário.'
        );

        return;

    }


    if (!idBaia) {

        alert(
            'Selecione a baia.'
        );

        return;

    }


    /* ==============================
       FORMDATA
    ============================== */

    const dados =
        new FormData();


    dados.append(
        'nome',
        nome
    );


    dados.append(
        'id_raca',
        idRaca
    );


    dados.append(
        'sexo',
        sexo
    );


    dados.append(
        'data_nascimento',
        dataNascimento
    );


    dados.append(
        'pelagem',
        pelagem
    );


    dados.append(
        'disponibilidade',
        disponibilidade
    );


    dados.append(
        'id_proprietario',
        idProprietario
    );


    dados.append(
        'id_baia',
        idBaia
    );


    if (arquivo) {

        dados.append(
            'foto',
            arquivo
        );

    }


    try {

        const resposta =
            await fetch(
                id
                    ? `/cavalo/${id}`
                    : `/cavalo`,
                {

                    method:
                        id
                            ? 'PUT'
                            : 'POST',

                    body:
                        dados

                }
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                'Erro ao salvar cavalo.'
            );

        }


        fecharModal();


        await carregarCavalos();


    } catch (erro) {

        console.error(
            'Erro ao salvar cavalo:',
            erro
        );


        alert(
            erro.message
        );

    }

}


/* =====================================================
   EXCLUIR CAVALO
===================================================== */

async function excluirCavalo(id) {

    const confirmar =
        confirm(
            'Tem certeza que deseja excluir este cavalo?'
        );


    if (!confirmar) {
        return;
    }


    try {

        const resposta =
            await fetch(
                `/cavalo/${id}`,
                {
                    method: 'DELETE'
                }
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                'Erro ao excluir cavalo.'
            );

        }


        carregarCavalos();


    } catch (erro) {

        console.error(
            'Erro ao excluir cavalo:',
            erro
        );


        alert(
            erro.message
        );

    }

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data) {

    if (!data) {
        return 'Não informada';
    }


    const partes =
        String(data)
            .substring(0, 10)
            .split('-');


    if (partes.length !== 3) {
        return data;
    }


    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto) {

    return String(texto ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


/* =====================================================
   INICIAR
===================================================== */

async function iniciar() {

    await carregarRacas();

    await carregarProprietarios();

    await carregarBaias();

    await carregarCavalos();

}


iniciar();


</script>
