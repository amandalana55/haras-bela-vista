<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Equipamentos | Haras Bela Vista</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ==============================
           EQUIPAMENTOS
        ============================== */

        .equipment-section {
            margin-top: 10px;
        }

        .equipment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .new-equipment-button {
            border: none;
            background: #3d3026;
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .new-equipment-button:hover {
            opacity: 0.9;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .equipment-card {
            background: white;
            border-radius: 20px;
            padding: 22px;
            min-height: 350px;

            box-shadow: 0 5px 18px rgba(61, 48, 38, 0.06);

            display: flex;
            flex-direction: column;

            transition: 0.2s;
        }

        .equipment-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(61, 48, 38, 0.10);
        }

        /* FOTO */

        .equipment-photo {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            overflow: hidden;
            background: #eee4d3;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 18px;
        }

        .equipment-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .equipment-photo-placeholder {
            font-size: 50px;
        }

        /* CABEÇALHO */

        .equipment-top {
            display: flex;
            align-items: center;
            gap: 15px;

            padding-bottom: 18px;

            border-bottom: 1px solid #eee8df;
        }

        .equipment-icon {
            width: 54px;
            height: 54px;

            flex-shrink: 0;

            border-radius: 16px;

            background: #eee4d3;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 25px;
        }

        .equipment-name {
            font-family: Georgia, serif;
            font-size: 20px;
            font-weight: 500;
            color: #3d3026;
            margin: 0;
        }

        /* INFORMAÇÕES */

        .equipment-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 16px;
        }

        .equipment-info-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .equipment-info-item span {
            color: #8d8074;
            font-size: 11px;
        }

        .equipment-info-item strong {
            color: #3d3026;
            font-size: 13px;
            font-weight: 500;
        }

        /* SITUAÇÃO */

        .equipment-status {
            display: inline-block;
            width: fit-content;

            padding: 5px 9px;

            border-radius: 8px;

            font-size: 11px;
        }

        .status-disponivel {
            background: #e4eee2;
            color: #5c7957;
        }

        .status-indisponivel {
            background: #f3e1dd;
            color: #9b6258;
        }

        /* BOTÕES */

        .equipment-actions {
            display: flex;
            gap: 10px;

            margin-top: auto;
            padding-top: 16px;
        }

        .equipment-actions button {
            border: none;

            padding: 9px 14px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 12px;
        }

        .edit-button {
            background: #eee4d3;
            color: #5f4d3d;
        }

        .delete-button {
            background: #f3e1dd;
            color: #9b6258;
        }

        .equipment-actions button:hover {
            opacity: 0.85;
        }

        .equipment-loading {
            color: #8d8074;
            font-size: 14px;
        }

        /* ==============================
           MODAL
        ============================== */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(45, 36, 29, 0.45);

            align-items: center;
            justify-content: center;

            z-index: 1000;

            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;

            width: 100%;
            max-width: 520px;

            max-height: 90vh;

            overflow-y: auto;

            border-radius: 22px;

            padding: 28px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .modal-content h3 {
            font-family: Georgia, serif;

            margin: 0 0 22px 0;

            font-size: 24px;

            color: #3d3026;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;

            font-size: 12px;

            color: #76695d;

            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            box-sizing: border-box;

            padding: 11px 12px;

            border: 1px solid #ddd4c9;

            border-radius: 10px;

            font-size: 13px;

            outline: none;

            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #a1825b;
        }

        /* PREVIEW */

        .photo-preview {
            width: 100%;
            height: 180px;

            border-radius: 14px;

            overflow: hidden;

            background: #eee4d3;

            margin-top: 10px;

            display: none;

            align-items: center;
            justify-content: center;
        }

        .photo-preview.active {
            display: flex;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .current-photo {
            margin-top: 8px;

            color: #8d8074;

            font-size: 11px;
        }

        /* BOTÕES MODAL */

        .modal-buttons {
            display: flex;

            justify-content: flex-end;

            gap: 10px;

            margin-top: 22px;
        }

        .modal-buttons button {
            border: none;

            padding: 11px 17px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 13px;
        }

        .cancel-button {
            background: #eee8df;
            color: #6d6258;
        }

        .save-button {
            background: #3d3026;
            color: white;
        }

        /* RESPONSIVO */

        @media (max-width: 1100px) {

            .equipment-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .equipment-grid {
                grid-template-columns: 1fr;
            }

            .equipment-header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="layout">

    <!-- MENU -->

    <aside class="sidebar">

        <div class="logo">

            <span>🐎</span>

            <h1>Haras</h1>

            <p>Bela Vista</p>

        </div>

        <nav class="menu">

            <a href="index.html" class="menu-item">
                <span>⌂</span>
                Início
            </a>

            <a href="cavalo.html" class="menu-item">
                <span>🐴</span>
                Cavalos
            </a>

            <a href="passeios.html" class="menu-item">
                <span>🏇</span>
                Passeios
            </a>

            <a href="clientes.html" class="menu-item">
                <span>👥</span>
                Clientes
            </a>

            <a href="proprietarios.html" class="menu-item">
                <span>👤</span>
                Proprietários
            </a>

            <a href="equipamentos.html" class="menu-item active">
                <span>🎒</span>
                Equipamentos
            </a>

            <a href="shop.html" class="menu-item">
                <span>🏪</span>
                Shop
            </a>

            <a href="relatorios.html" class="menu-item">
                <span>📊</span>
                Relatórios
            </a>

        </nav>

    </aside>


    <!-- CONTEÚDO -->

    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="welcome">
                    GERENCIAMENTO
                </p>

                <h2>
                    Equipamentos
                </h2>

            </div>

            <div class="manager">

                <div class="manager-icon">
                    👤
                </div>

                <div>

                    <strong>
                        Gerente
                    </strong>

                    <small>
                        Administrador
                    </small>

                </div>

            </div>

        </header>


        <section class="equipment-section">

            <div class="equipment-header">

                <div>

                    <p class="section-subtitle">
                        HARAS BELA VISTA
                    </p>

                    <h3>
                        Equipamentos cadastrados
                    </h3>

                </div>

                <button
                    class="new-equipment-button"
                    onclick="abrirNovoEquipamento()"
                >
                    + Novo equipamento
                </button>

            </div>


            <div
                id="equipmentGrid"
                class="equipment-grid"
            >

                <p class="equipment-loading">
                    Carregando equipamentos...
                </p>

            </div>

        </section>

    </main>

</div>


<!-- ==============================
     MODAL
============================== -->

<div
    id="equipmentModal"
    class="modal"
>

    <div class="modal-content">

        <h3 id="modal-title">
            Novo equipamento
        </h3>


        <input
            type="hidden"
            id="equipment-id"
        >


        <div class="form-group">

            <label>
                Tipo de equipamento
            </label>

            <input
                type="text"
                id="equipment-tipo"
                placeholder="Ex.: Sela, arreio, bridão..."
            >

        </div>


        <div class="form-group">

            <label>
                Valor do aluguel
            </label>

            <input
                type="number"
                id="equipment-valor"
                placeholder="0.00"
                step="0.01"
                min="0"
            >

        </div>


        <div class="form-group">

            <label>
                Situação
            </label>

            <select id="equipment-situacao">

                <option value="Disponível">
                    Disponível
                </option>

                <option value="Indisponível">
                    Indisponível
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Equipamento do cavalo
            </label>

            <select id="equipment-cavalo">

                <option value="">
                    Equipamento do Haras
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Foto do equipamento
            </label>

            <input
                type="file"
                id="equipment-foto"
                accept=".jpg,.jpeg,.png,.webp"
                onchange="previewFoto()"
            >


            <div
                id="photoPreview"
                class="photo-preview"
            >

                <img
                    id="photoPreviewImage"
                    src=""
                    alt="Pré-visualização"
                >

            </div>


            <p
                id="currentPhoto"
                class="current-photo"
            ></p>

        </div>


        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="fecharModal()"
            >
                Cancelar
            </button>

            <button
                class="save-button"
                onclick="salvarEquipamento()"
            >
                Salvar
            </button>

        </div>

    </div>

</div>


<script>

const imagensURL = '';


/* ==============================
   CARREGAR EQUIPAMENTOS
============================== */

async function carregarEquipamentos() {

    const grid =
        document.getElementById('equipmentGrid');

    try {

        const resposta =
            await fetch('/equipamentos');

        if (!resposta.ok) {
            throw new Error(
                'Erro HTTP: ' + resposta.status
            );
        }

        const equipamentos =
            await resposta.json();

        grid.innerHTML = '';


        if (!equipamentos.length) {

            grid.innerHTML = `
                <p class="equipment-loading">
                    Nenhum equipamento cadastrado.
                </p>
            `;

            return;
        }


        equipamentos.forEach(equipamento => {

            const card =
                document.createElement('article');

            card.className =
                'equipment-card';


            const situacao =
                equipamento.situacao ||
                'Disponível';


            const classeSituacao =
                situacao
                    .toLowerCase()
                    .includes('indispon')
                    ? 'status-indisponivel'
                    : 'status-disponivel';


            let fotoHTML;


            if (equipamento.foto) {

                fotoHTML = `
                    <img
                        src="${imagensURL}${equipamento.foto}"
                        alt="${escapeHTML(equipamento.tipo)}"
                        onerror="this.parentElement.innerHTML='<div class=&quot;equipment-photo-placeholder&quot;>🎒</div>'"
                    >
                `;

            } else {

                fotoHTML = `
                    <div class="equipment-photo-placeholder">
                        🎒
                    </div>
                `;

            }


            card.innerHTML = `

                <div class="equipment-photo">

                    ${fotoHTML}

                </div>


                <div class="equipment-top">

                    <div class="equipment-icon">
                        🎒
                    </div>

                    <div>

                        <h4 class="equipment-name">
                            ${escapeHTML(equipamento.tipo)}
                        </h4>

                    </div>

                </div>


                <div class="equipment-info">

                    <div class="equipment-info-item">

                        <span>
                            Valor do aluguel
                        </span>

                        <strong>
                            R$
                            ${Number(
                                equipamento.valor_aluguel || 0
                            ).toFixed(2).replace('.', ',')}
                        </strong>

                    </div>


                    <div class="equipment-info-item">

                        <span>
                            Situação
                        </span>

                        <strong>

                            <span
                                class="equipment-status ${classeSituacao}"
                            >
                                ${escapeHTML(situacao)}
                            </span>

                        </strong>

                    </div>


                    <div class="equipment-info-item">

                        <span>
                            Cavalo
                        </span>

                        <strong>
                            ${
                                equipamento.cavalo
                                    ? escapeHTML(equipamento.cavalo)
                                    : 'Equipamento do Haras'
                            }
                        </strong>

                    </div>

                </div>


                <div class="equipment-actions">

                    <button
                        class="edit-button"
                        data-id="${equipamento.id_equipamento}"
                    >
                        ✏️ Editar
                    </button>

                    <button
                        class="delete-button"
                        data-id="${equipamento.id_equipamento}"
                    >
                        🗑️ Excluir
                    </button>

                </div>

            `;


            card.querySelector('.edit-button')
                .addEventListener(
                    'click',
                    () => editarEquipamento(equipamento)
                );


            card.querySelector('.delete-button')
                .addEventListener(
                    'click',
                    () => excluirEquipamento(
                        equipamento.id_equipamento
                    )
                );


            grid.appendChild(card);

        });


    } catch (erro) {

        console.error(
            'Erro ao carregar equipamentos:',
            erro
        );

        grid.innerHTML = `
            <p class="equipment-loading">
                Não foi possível carregar os equipamentos.
            </p>
        `;

    }

}


/* ==============================
   PROTEGER TEXTO HTML
============================== */

function escapeHTML(text) {

    if (text === null || text === undefined) {
        return '';
    }

    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

}


/* ==============================
   CARREGAR CAVALOS
============================== */

async function carregarCavalos() {

    const select =
        document.getElementById(
            'equipment-cavalo'
        );

    try {

        const resposta =
            await fetch('/cavalo');

        if (!resposta.ok) {
            throw new Error(
                'Erro ao buscar cavalos.'
            );
        }

        const cavalos =
            await resposta.json();


        select.innerHTML = `

            <option value="">
                Equipamento do Haras
            </option>

        `;


        cavalos.forEach(cavalo => {

            const option =
                document.createElement('option');

            option.value =
                cavalo.id_cavalo;

            option.textContent =
                cavalo.nome;

            select.appendChild(option);

        });


    } catch (erro) {

        console.error(
            'Erro ao carregar cavalos:',
            erro
        );

    }

}


/* ==============================
   NOVO EQUIPAMENTO
============================== */

function abrirNovoEquipamento() {

    document.getElementById(
        'modal-title'
    ).textContent =
        'Novo equipamento';


    document.getElementById(
        'equipment-id'
    ).value = '';


    document.getElementById(
        'equipment-tipo'
    ).value = '';


    document.getElementById(
        'equipment-valor'
    ).value = '';


    document.getElementById(
        'equipment-situacao'
    ).value =
        'Disponível';


    document.getElementById(
        'equipment-cavalo'
    ).value = '';


    document.getElementById(
        'equipment-foto'
    ).value = '';


    document.getElementById(
        'currentPhoto'
    ).textContent = '';


    document.getElementById(
        'photoPreview'
    ).classList.remove('active');


    document.getElementById(
        'photoPreviewImage'
    ).src = '';


    document.getElementById(
        'equipmentModal'
    ).classList.add('active');

}


/* ==============================
   EDITAR EQUIPAMENTO
============================== */

function editarEquipamento(equipamento) {

    document.getElementById(
        'modal-title'
    ).textContent =
        'Editar equipamento';


    document.getElementById(
        'equipment-id'
    ).value =
        equipamento.id_equipamento;


    document.getElementById(
        'equipment-tipo'
    ).value =
        equipamento.tipo || '';


    document.getElementById(
        'equipment-valor'
    ).value =
        equipamento.valor_aluguel || '';


    document.getElementById(
        'equipment-situacao'
    ).value =
        equipamento.situacao || 'Disponível';


    document.getElementById(
        'equipment-cavalo'
    ).value =
        equipamento.id_cavalo || '';


    document.getElementById(
        'equipment-foto'
    ).value = '';


    const preview =
        document.getElementById(
            'photoPreview'
        );


    const imagem =
        document.getElementById(
            'photoPreviewImage'
        );


    const currentPhoto =
        document.getElementById(
            'currentPhoto'
        );


    if (equipamento.foto) {

        imagem.src =
            imagensURL +
            equipamento.foto;

        preview.classList.add('active');

        currentPhoto.textContent =
            'Foto atual. Se selecionar outra, ela será substituída.';

    } else {

        imagem.src = '';

        preview.classList.remove('active');

        currentPhoto.textContent =
            'Nenhuma foto cadastrada.';

    }


    document.getElementById(
        'equipmentModal'
    ).classList.add('active');

}


/* ==============================
   PREVISUALIZAR FOTO
============================== */

function previewFoto() {

    const input =
        document.getElementById(
            'equipment-foto'
        );

    const preview =
        document.getElementById(
            'photoPreview'
        );

    const imagem =
        document.getElementById(
            'photoPreviewImage'
        );


    if (
        !input.files ||
        !input.files[0]
    ) {

        return;

    }


    const arquivo =
        input.files[0];


    const tiposPermitidos = [
        'image/jpeg',
        'image/png',
        'image/webp'
    ];


    if (
        !tiposPermitidos.includes(
            arquivo.type
        )
    ) {

        alert(
            'Selecione uma imagem JPG, PNG ou WEBP.'
        );

        input.value = '';

        return;

    }


    if (
        arquivo.size >
        5 * 1024 * 1024
    ) {

        alert(
            'A imagem deve ter no máximo 5 MB.'
        );

        input.value = '';

        return;

    }


    const leitor =
        new FileReader();


    leitor.onload =
        function(evento) {

            imagem.src =
                evento.target.result;

            preview.classList.add(
                'active'
            );

        };


    leitor.readAsDataURL(
        arquivo
    );

}


/* ==============================
   FECHAR MODAL
============================== */

function fecharModal() {

    document.getElementById(
        'equipmentModal'
    ).classList.remove(
        'active'
    );

}


/* ==============================
   SALVAR EQUIPAMENTO
============================== */

async function salvarEquipamento() {

    const id =
        document.getElementById(
            'equipment-id'
        ).value;


    const tipo =
        document.getElementById(
            'equipment-tipo'
        ).value.trim();


    const valor =
        Number(
            document.getElementById(
                'equipment-valor'
            ).value
        );


    const situacao =
        document.getElementById(
            'equipment-situacao'
        ).value;


    const idCavalo =
        document.getElementById(
            'equipment-cavalo'
        ).value;


    const arquivo =
        document.getElementById(
            'equipment-foto'
        ).files[0];


    if (!tipo) {

        alert(
            'Informe o tipo de equipamento.'
        );

        return;

    }


    if (
        isNaN(valor) ||
        valor < 0
    ) {

        alert(
            'Informe um valor de aluguel válido.'
        );

        return;

    }


    const formData =
        new FormData();


    formData.append(
        'tipo',
        tipo
    );


    formData.append(
        'valor_aluguel',
        valor
    );


    formData.append(
        'situacao',
        situacao
    );


    formData.append(
        'id_cavalo',
        idCavalo || ''
    );


    if (arquivo) {

        formData.append(
            'foto',
            arquivo
        );

    }


    try {

        const resposta =
            await fetch(
                id
                    ? `/equipamentos/${id}`
                    : '/equipamentos',
                {
                    method:
                        id
                            ? 'PUT'
                            : 'POST',

                    body:
                        formData
                }
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                'Erro ao salvar equipamento.'
            );

        }


        fecharModal();

        await carregarEquipamentos();


    } catch (erro) {

        console.error(
            'Erro ao salvar equipamento:',
            erro
        );

        alert(
            erro.message
        );

    }

}


/* ==============================
   EXCLUIR EQUIPAMENTO
============================== */

async function excluirEquipamento(id) {

    const confirmar =
        confirm(
            'Tem certeza que deseja excluir este equipamento?'
        );


    if (!confirmar) {
        return;
    }


    try {

        const resposta =
            await fetch(
                `/equipamentos/${id}`,
                {
                    method: 'DELETE'
                }
            );


        const resultado =
            await resposta.json();


        if (!resposta.ok) {

            throw new Error(
                resultado.erro ||
                'Erro ao excluir equipamento.'
            );

        }


        await carregarEquipamentos();


    } catch (erro) {

        console.error(
            'Erro ao excluir equipamento:',
            erro
        );

        alert(
            erro.message
        );

    }

}


/* ==============================
   FECHAR CLICANDO FORA DO MODAL
============================== */
